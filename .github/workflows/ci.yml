name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every check on the module code: tfcapi-lint, then license headers, fmt,
  # layout and tags, validate on both runtimes and their floors, unit tests,
  # shellcheck, tflint and trivy. `make verify` runs its independent groups
  # side by side, so the job takes as long as the slowest runtime, not the
  # sum.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The role and the allowed warnings come from the Makefile (ROLE,
      # TFCAPI_LINT_ALLOW), so CI lints exactly as `make tfcapi-lint` does.
      - name: tfcapi-lint settings
        id: lint
        run: |
          echo "role=$(make -s --no-print-directory print-ROLE)" >>"${GITHUB_OUTPUT}"
          echo "allow=$(make -s --no-print-directory print-TFCAPI_LINT_ALLOW)" >>"${GITHUB_OUTPUT}"
      # The provider's tfcapi-lint image, at the version the pin names
      # (https://captf.io/docs/module-author/tfcapi-lint-ci.html).
      - uses: captf-io/cluster-api-provider-terraform/actions/tfcapi-lint@a31db9395964b771715992f9b63409e7c4044c4c # v0.1.1
        with:
          command: module
          target: .
          role: ${{ steps.lint.outputs.role }}
          strict: true
          args: ${{ steps.lint.outputs.allow }}
      # tfcapi-lint ran above, so `make verify` prints SKIP for it here: CI
      # has no provider checkout to build it from. Runs even when the lint
      # failed, to report every problem in one go.
      - name: Verify
        if: ${{ !cancelled() }}
        env:
          # tflint downloads its rulesets from GitHub releases.
          GITHUB_TOKEN: ${{ github.token }}
        run: make verify ENGINE=docker

  # A release tag that passed verify gets its GitHub Release, with notes from
  # .github/release-notes.sh (upgrade notes come from the tag message body).
  # Only an annotated tag on main that GitHub shows as signed gets one;
  # module-images verifies the signature again before it builds the image.
  # Re-running the job rewrites the notes of the existing release.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # checkout leaves the pushed tag lightweight; fetch the tag object.
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          [[ "$(git cat-file -t "refs/tags/${TAG}")" == tag ]] ||
            { echo "::error::${TAG} is not an annotated tag"; exit 1; }
          verified="$(gh api "repos/${GH_REPO}/git/tags/$(git rev-parse "refs/tags/${TAG}")" -q .verification.verified)"
          [[ "${verified}" == true ]] ||
            { echo "::error::GitHub does not show ${TAG} as signed"; exit 1; }
          git merge-base --is-ancestor "refs/tags/${TAG}^{commit}" origin/main ||
            { echo "::error::${TAG} is not on main"; exit 1; }

          .github/release-notes.sh "${TAG}" >"${RUNNER_TEMP}/notes.md"
          flags=(--title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md")
          newest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          if [[ "${TAG}" == *-rc.* ]]; then
            flags+=(--prerelease --latest=false)
          elif [[ "${TAG}" == "${newest}" ]]; then
            flags+=(--latest=true)
          else
            flags+=(--latest=false)
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" "${flags[@]}"
          else
            gh release create "${TAG}" --verify-tag "${flags[@]}"
          fi
