version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "03:00"
      timezone: "Etc/UTC"
    # No auto-rebase: each rebase re-runs CI on the PR. Two open PRs at
    # most, and one grouped PR per ecosystem per run.
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
